<style>
:root{--primary:#5B9700;--primary-dark:#5B9700;--primary-darker:#5B9700;--primary-light:#5B9700;--primary-lighter:#84DB00;--primary-pale:#DBFFA6;--accent:#F68D23;--accent-dark:#497900;--accent-pale:#EAFFC9;--bg:#F4F7F9;--paper:#FFFFFF;--ink:#5B9700;--ink-soft:#5B9700;--ink-faint:#5B9700;--line:#EAFFC9;--font-display:'Fraunces',serif;--font-body:'Inter',sans-serif;--font-mono:'IBM Plex Mono',monospace;--container:1140px;--radius-s:10px;--radius-m:18px;--radius-l:28px;--shadow-sm:0 1px 3px rgba(37,150,190,0.08);--shadow-md:0 4px 16px rgba(37,150,190,0.12);--shadow-lg:0 12px 40px -8px rgba(37,150,190,0.2);}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
h1,h2,h3,h4{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-0.02em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:3px;border-radius:6px;}
::selection{background:var(--primary);color:#fff;}
.container{max-width:var(--container);margin:0 auto;padding:0 20px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:50px;font-family:var(--font-body);font-weight:600;font-size:13.5px;border:1.5px solid transparent;transition:all .25s ease;white-space:nowrap;}
.btn svg{width:14px;height:14px;flex-shrink:0;}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(37,150,190,0.3);}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,150,190,0.35);}
.btn-accent{background:var(--accent);color:#fff;}
.btn-outline-light{border-color:rgba(255,255,255,.4);color:#fff;}
.btn-outline-light:hover{border-color:#fff;background:rgba(255,255,255,.12);transform:translateY(-2px);}
.icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

.site-header{position:sticky;top:0;left:0;right:0;z-index:100;background:rgba(73,163,0,0.88);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,0.1);}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;max-width:var(--container);margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;color:#fff;}
.brand-mark{width:32px;height:32px;flex-shrink:0;border-radius:50%;object-fit:cover;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:-.01em;}
.brand-text span{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--primary-lighter);}

.hero{background:linear-gradient(155deg,rgba(73,163,0,0.88) 0%,rgba(64,122,32,0.75) 40%,rgba(255,234,127,0.65) 100%),url('https://images.unsplash.com/photo-1730697897470-0efaee4922de?w=1400&q=80');background-size:cover;background-position:center;color:#fff;padding:36px 0 40px;text-align:center;}
.hero-title{font-family:var(--font-display);font-weight:300;font-size:clamp(28px,5vw,52px);line-height:.92;color:#fff;letter-spacing:-.03em;margin-bottom:8px;}
.hero-title em{font-style:italic;font-weight:600;color:var(--accent);}
.hero-sub{margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto;color:rgba(255,255,255,.85);font-size:14px;line-height:1.5;}
.hero-home{display:inline-flex;align-items:center;gap:4px;margin-top:10px;color:var(--primary-lighter);font-size:12px;}
.hero-home:hover{color:#fff;}

.menu-section{padding:24px 0 0;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-m);transition:all .25s;position:relative;overflow:hidden;color:var(--ink-soft);}
.menu-item::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:3px;background:var(--primary);border-radius:3px;transform:scaleX(0);transition:transform .3s ease;}
.menu-item:hover{border-color:var(--primary-light);transform:translateY(-2px);box-shadow:var(--shadow-md);color:var(--primary);}
.menu-item.active{border-color:var(--primary);background:var(--primary-pale);box-shadow:var(--shadow-sm);color:var(--primary);}
.menu-item.active::after{transform:scaleX(1);}
.menu-item i{width:20px;height:20px;}
.menu-item .mlabel{font-size:10px;font-weight:600;line-height:1.2;text-align:center;}
@media(max-width:820px){.menu-grid{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));}}
@media(max-width:500px){.menu-grid{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));}}

.content-section{padding:24px 0 36px;}
.content-panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-m);padding:22px 24px;min-height:150px;box-shadow:var(--shadow-sm);}
.panel-stack{display:flex;flex-direction:column;gap:12px;}
.panel{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;}
.panel-head{padding:11px 16px;background:var(--primary);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;}
.panel-head .icon{color:rgba(255,255,255,.8);width:16px;height:16px;}
.panel-head.alt{background:var(--primary-dark);}
.panel-body{padding:12px 16px;}
.panel-body p{color:var(--ink-soft);font-size:14px;line-height:1.7;margin-bottom:8px;}
.check-list li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink);padding:5px 0;border-bottom:1px dashed var(--line);}
.check-list li:last-child{border-bottom:none;}
.check-list .icon{color:var(--primary);margin-top:2px;width:14px;height:14px;flex-shrink:0;}

.site-footer{background:var(--primary-darker);color:rgba(255,255,255,.8);padding:32px 0 18px;text-align:center;}
.site-footer a{color:var(--primary-lighter);}
.site-footer a:hover{color:#fff;}
.site-footer p{font-size:12px;color:rgba(255,255,255,.5);margin-top:8px;}

@media(max-width:600px){.menu-grid{grid-template-columns:repeat(3,1fr);}}
#langSwitcher option { color: #000; }
main{animation:pageFade 0.45s ease}@keyframes pageFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<script>
const ICON_CHECK = '<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
function i18nT(key, fallback) { try { if (window.i18n && window.i18n.t) { var t = window.i18n.t(key); if (t !== key) return t; } } catch(e) {} return fallback; }

const menuItems = [
  { id:'about', icon:'info', label:'About Program', key:'menu.about', url:'/about.html' },
  { id:'ready', icon:'briefcase', label:'Getting Ready', key:'menu.ready', url:'/ready.html' },
  { id:'accom', icon:'home', label:'Accommodations', key:'menu.accom', url:'/accom.html' },
  { id:'agenda', icon:'calendar', label:'Agenda', key:'menu.agenda', url:'/agenda.html' },
  { id:'essay', icon:'award', label:'Essay Contest', key:'menu.essay', url:'/essay.html' },
  { id:'programbook', icon:'book-open', label:'Program Book', key:'menu.programbook', url:'/programbook.html' },
  { id:'speakers', icon:'users', label:"Speaker's Profile", key:'menu.speakers', url:'/speakers.html' },
  { id:'participants', icon:'user-check', label:'Participants', key:'menu.participants', url:'/participants.html' },
  { id:'partners', icon:'handshake', label:'Supporting Partners', key:'menu.partners', url:'/partners.html' },
  { id:'gallery', icon:'image', label:'Gallery', key:'menu.gallery', url:'/gallery.html' },
  { id:'library', icon:'book', label:'Course Library', key:'menu.library', url:'/course/library.html' }
];

const currentSection = 'about';

function renderMenu() {
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = menuItems.map(m => '<a href="' + m.url + '" class="menu-item' + (m.id === currentSection ? ' active' : '') + '"><i data-feather="' + m.icon + '"></i><span class="mlabel">' + i18nT(m.key, m.label) + '</span></a>').join('');
  if (typeof feather !== 'undefined') feather.replace();
}

function renderContent() {
  document.getElementById('contentPanel').innerHTML = '<div class="panel-stack"><div class="panel"><div class="panel-head"><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>' + i18nT('about.panel1.title','About SAMI Summer Course') + '</div><div class="panel-body"><p>' + i18nT('about.panel1.text1','SAMI Summer Course is an international academic program held since 2017 by the Department of Management, IPB University. Its goals? To enhance institutional competitiveness, expand global networks, and provide cross-cultural learning experiences through inter-country collaboration.') + '</p><p>' + i18nT('about.panel1.text2','The 9th edition this year runs hybrid from <strong>27 July – 15 August 2026</strong>, with the main location at IPB Dramaga Campus, Bogor. There are <strong>14 courses</strong> on sustainable agrifood management with 12 online courses (2 credits) plus an additional offline track with 2 hybrid courses and field visits (4 credits). An essay contest is also held to sharpen participants analytical skills.') + '</p><p>' + i18nT('about.panel1.theme','Theme: <strong>"Building Climate Resilience and Sustainable Agrifood Management through ESG"</strong>') + '</p></div></div><div class="panel"><div class="panel-head alt"><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>' + i18nT('about.panel2.title','Program Objectives') + '</div><div class="panel-body"><ul class="check-list"><li>' + ICON_CHECK + i18nT('about.panel2.items.0','Enhance participants knowledge and skills in specific fields of study') + '</li><li>' + ICON_CHECK + i18nT('about.panel2.items.1','Interactive learning with collaborative approaches') + '</li><li>' + ICON_CHECK + i18nT('about.panel2.items.2','Expand international networks between participants and host institutions') + '</li><li>' + ICON_CHECK + i18nT('about.panel2.items.3','Introduce local culture to international participants and strengthen cultural diplomacy') + '</li></ul></div></div><div class="panel"><div class="panel-head"><svg class="icon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + i18nT('about.panel3.title','Who Can Join?') + '</div><div class="panel-body"><ul class="check-list"><li>' + ICON_CHECK + i18nT('about.panel3.items.0','Undergraduate or graduate students from any discipline') + '</li><li>' + ICON_CHECK + i18nT('about.panel3.items.1','Faculty members and researchers interested in sustainable agrifood') + '</li><li>' + ICON_CHECK + i18nT('about.panel3.items.2','Professionals in agriculture, food, environment, or related fields') + '</li><li>' + ICON_CHECK + i18nT('about.panel3.items.3','International participants from partner universities worldwide') + '</li></ul></div></div></div>';
}

function initApp() {
  renderMenu();
  renderContent();
  if (typeof feather !== 'undefined') feather.replace();
  if (window.i18n) {
    window.i18n.onLanguageChange(function() {
      renderMenu();
      renderContent();
      if (typeof feather !== 'undefined') feather.replace();
    });
  }
}
if (window.i18n && window.i18n.ready) { window.i18n.ready.then(initApp); } else { document.addEventListener('DOMContentLoaded', function() { setTimeout(initApp, 100); }); }
</script>
